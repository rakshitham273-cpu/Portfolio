# Nginx config template for portfolio. Replace example.com with your domain.
# Place this at /etc/nginx/sites-available/portfolio then enable and reload nginx.

server {
    listen 80;
    server_name example.com www.example.com;

    root /var/www/portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 20M;

    # Logging (optional)
    access_log /var/log/nginx/portfolio.access.log;
    error_log /var/log/nginx/portfolio.error.log;
}

# After obtaining cert with certbot, Certbot will add a server block for SSL.
# If you prefer to configure SSL manually, add a server block listening on 443
# with `ssl_certificate` and `ssl_certificate_key` pointing to your cert files,
# and include recommended SSL settings (HSTS, modern ciphers).
